<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Wallet CopyTrader Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f8f7f4;
            --card: #ffffff;
            --text: #1f1f1f;
            --accent: #3b82f6;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .topbar {
            background: white;
            padding: 15px 25px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .metric-card {
            background: var(--card);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-value {
            font-size: 28px;
            font-weight: 600;
            margin-top: 8px;
        }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            padding: 0 20px 20px;
        }
        .wallet-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .chart-container {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 { margin: 0; font-size: 20px; }
        .last-updated { font-size: 13px; color: #888; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Multi-Wallet CopyTrader Dashboard</h1>
        <div class="last-updated" id="last-updated">Last updated: just now</div>
    </div>

    <div id="error-banner" style="display:none;background:#fee2e2;color:#991b1b;padding:10px 25px;font-size:14px;"></div>

    <div class="metrics" id="metrics">
        <!-- Populated by JS -->
    </div>

    <div class="chart-container">
        <h2>Cumulative PnL</h2>
        <canvas id="pnlChart" height="120"></canvas>
    </div>

    <div class="wallet-grid" id="wallet-grid">
        <!-- Populated by JS -->
    </div>

    <script>
        let pnlChart = null;

        function initChart() {
            const ctx = document.getElementById('pnlChart').getContext('2d');
            pnlChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Cumulative PnL ($)',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59,130,246,0.08)',
                        borderWidth: 2,
                        pointRadius: 2,
                        fill: true,
                        tension: 0.3,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: {
                            ticks: {
                                callback: v => '$' + v.toFixed(2)
                            }
                        }
                    }
                }
            });
        }

        function updateChart(pnlHistory) {
            if (!pnlChart) initChart();
            // pnl_history is [[timestamp, cumulative_pnl], ...]
            pnlChart.data.labels   = pnlHistory.map(([ts]) =>
                new Date(ts * 1000).toLocaleTimeString());
            pnlChart.data.datasets[0].data = pnlHistory.map(([, pnl]) => pnl);
            pnlChart.update();
        }

        async function fetchData() {
            try {
                const res = await fetch('/data');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // Update main metrics
                document.getElementById('metrics').innerHTML = `
                    <div class="metric-card">
                        <div class="metric-label">Balance</div>
                        <div class="metric-value">$${data.bankroll.toFixed(2)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total PnL</div>
                        <div class="metric-value ${data.total_pnl >= 0 ? 'positive' : 'negative'}">
                            ${data.total_pnl >= 0 ? '+' : ''}$${data.total_pnl.toFixed(2)}
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Win Rate</div>
                        <div class="metric-value">${data.win_rate}%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Open Positions</div>
                        <div class="metric-value">${data.open_count}/${data.max_positions || 8}</div>
                    </div>
                `;

                // Update PnL chart
                updateChart(data.pnl_history || []);

                // Update wallet cards
                const grid = document.getElementById('wallet-grid');
                grid.innerHTML = Object.entries(data.wallets || {}).map(([name, w]) => `
                    <div class="wallet-card">
                        <h3>${name}</h3>
                        <p><strong>PnL:</strong> <span class="${w.total_pnl >= 0 ? 'positive' : 'negative'}">$${Number(w.total_pnl).toFixed(2)}</span></p>
                        <p><strong>Win Rate:</strong> ${w.win_rate}% (${w.wins}W / ${w.losses}L)</p>
                        <p><strong>Open:</strong> ${w.open}</p>
                        <h4>Last Closed Trades</h4>
                        ${w.closed_trades.length ? `<ul>
                            ${w.closed_trades.map(t => `
                                <li>${t.outcome} | ${(t.entry_price*100).toFixed(1)}¢ → ${(t.exit_price*100).toFixed(1)}¢ | <strong>$${Number(t.pnl).toFixed(2)}</strong></li>
                            `).join('')}
                        </ul>` : '<p style="color:#888;font-size:13px">No closed trades yet</p>'}
                    </div>
                `).join('');

                document.getElementById('last-updated').textContent =
                    `Last updated: ${new Date().toLocaleTimeString()}`;
                document.getElementById('error-banner').style.display = 'none';

            } catch (e) {
                console.error("Failed to fetch dashboard data", e);
                document.getElementById('error-banner').style.display = 'block';
                document.getElementById('error-banner').textContent =
                    `⚠ Could not reach /data — ${e.message}`;
            }
        }

        // Auto-refresh every 30 s (matching ~2× the bot's poll interval)
        setInterval(fetchData, 30000);
        fetchData();
    </script>
</body>
</html>
